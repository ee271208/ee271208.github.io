<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Ins Vibe</title>
    <!-- 引入 reference 中的 "vibe coding" 复古打字机字体与 Ins 极简字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(255, 255, 255, 0.95);
            --text-main: #18181b;
            --text-sub: #71717a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: var(--text-main);
            /* 读取你在 GitHub 上传的真实文件名 bj.jpg */
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 磨砂滤镜遮罩：提升图片整体的 Ins 柔光质感 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 249, 250, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 标题部分：vibe coding 风格 */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .typewriter-tag {
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .main-title {
            font-family: 'Courier Prime', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .sub-vibe {
            font-family: 'Courier Prime', monospace;
            font-size: 1.15rem;
            color: #3f3f46;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* 卡片网格：纯白极简磨砂 Ins 风 */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 24px;
            margin: 30px 0;
        }

        .folder-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 28px 20px 22px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .folder-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.95);
        }

        .tape {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 14px;
            background: rgba(228, 228, 231, 0.6);
            border-left: 1px dashed rgba(255, 255, 255, 0.8);
            border-right: 1px dashed rgba(255, 255, 255, 0.8);
        }

        .folder-icon {
            font-size: 1.8rem;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .folder-title {
            font-family: 'Courier Prime', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .folder-sub {
            font-size: 0.78rem;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        /* 弹窗部分 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 20px;
            padding: 36px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f4f4f5;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            color: #71717a;
            font-size: 1rem;
        }

        .modal-tag {
            font-family: 'Courier Prime', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .modal-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #3f3f46;
        }

        footer {
            text-align: center;
            font-family: 'Courier Prime', monospace;
            font-size: 0.78rem;
            color: var(--text-sub);
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="typewriter-tag">* CREATIVE PORTFOLIO *</div>
            <h1 class="main-title">Curated by [你的名字]</h1>
            <div class="sub-vibe">* vibe * coding *</div>
        </header>

        <main class="folder-grid">
            <div class="folder-card" onclick="openModal('about')">
                <div class="tape"></div>
                <div class="folder-icon">✦</div>
                <div class="folder-title">About Me</div>
                <div class="folder-sub">[关于我]</div>
            </div>

            <div class="folder-card" onclick="openModal('internship')">
                <div class="tape"></div>
                <div class="folder-icon">💼</div>
                <div class="folder-title">Works</div>
                <div class="folder-sub">[实习与经历]</div>
            </div>

            <div class="folder-card" onclick="openModal('school')">
                <div class="tape"></div>
                <div class="folder-icon">🎓</div>
                <div class="folder-title">School</div>
                <div class="folder-sub">[校园与学术]</div>
            </div>

            <div class="folder-card" onclick="openModal('life')">
                <div class="tape"></div>
                <div class="folder-icon">📷</div>
                <div class="folder-title">Life</div>
                <div class="folder-sub">[日常与记录]</div>
            </div>

            <div class="folder-card" onclick="openModal('contact')">
                <div class="tape"></div>
                <div class="folder-icon">✉️</div>
                <div class="folder-title">Contact</div>
                <div class="folder-sub">[联系方式]</div>
            </div>
        </main>

        <footer>
            © 2026 [你的名字] • ALL RIGHTS RESERVED
        </footer>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const contentMap = {
            'about': `<div class="modal-tag">* ABOUT ME</div><div class="modal-body">在这里写入个人介绍、求职意向与个人亮点...</div>`,
            'internship': `<div class="modal-tag">* WORKS & INTERNSHIP</div><div class="modal-body">在这里写入实习经历、具体工作项目与成果...</div>`,
            'school': `<div class="modal-tag">* EDUCATION & SCHOOL</div><div class="modal-body">在这里写入学校、专业背景与学术项目...</div>`,
            'life': `<div class="modal-tag">* LIFE & VIBE</div><div class="modal-body">在这里写入你的生活记录、摄影与Vlog...</div>`,
            'contact': `<div class="modal-tag">* CONTACT</div><div class="modal-body">邮箱：your_email@example.com<br>微信：your_wechat</div>`
        };

        function openModal(type) {
            document.getElementById('modalContent').innerHTML = contentMap[type] || '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }
    </script>
</body>
</html>
