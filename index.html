<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Wang's Universe</title>
    <!-- 引入欧阳娜娜同款连笔耳机线条手写体 (Sacramento) 与高级衬线体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans SC', sans-serif;
            color: #ffffff;
            /* 原图高清呈现，无模糊遮挡 */
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* 顶栏标题：高挂置顶，完全避开额头 */
        header {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        .universe-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
        }

        .universe-sub {
            font-family: 'Sacramento', cursive;
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.95);
            margin-top: -6px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* --------------------------------------------------
           欧阳娜娜同款：耳机线条字体组件 (Wire Earphone Text)
        -------------------------------------------------- */
        .wire-item {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            /* 给耳机线和字体叠加阴影，保证在湖水波光上清晰可见 */
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 2px rgba(0, 0, 0, 0.4));
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 随水波轻微飘动 */
            animation: wireFloat 4s ease-in-out infinite;
        }

        @keyframes wireFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .wire-item:hover {
            transform: scale(1.2) translateY(-3px) !important;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
            animation-play-state: paused;
        }

        /* 连笔耳机线手写英文 */
        .wire-text {
            font-family: 'Sacramento', cursive;
            font-size: 2.6rem;
            color: #ffffff;
            line-height: 1;
            white-space: nowrap;
            margin: 0 -3px; /* 极窄缝隙，让文字与两端耳机线自然接合 */
            letter-spacing: 0.5px;
            user-select: none;
        }

        /* 左右耳机线与耳塞 SVG 图标 */
        .headphone-wire-svg {
            width: 50px;
            height: 28px;
            flex-shrink: 0;
        }

        /* --------------------------------------------------
           5个模块在湖面上的位置分布（精准避开人物身体）
        -------------------------------------------------- */
        /* 1. About Me (左下湖面) */
        #wire-about { top: 62%; left: 10%; animation-delay: 0s; }
        
        /* 2. My Internship (左中湖面) */
        #wire-internship { top: 48%; left: 20%; animation-delay: 0.8s; }
        
        /* 3. My School (移至左侧上方空白湖面，绝不挡锁骨) */
        #wire-school { top: 32%; left: 26%; animation-delay: 1.6s; }
        
        /* 4. My Life (右上空白湖面) */
        #wire-life { top: 38%; right: 12%; animation-delay: 0.4s; }
        
        /* 5. Contact Me (右下湖面) */
        #wire-contact { top: 56%; right: 8%; animation-delay: 1.2s; }

        /* 详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.9);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .modal-body {
            font-size: 0.92rem;
            line-height: 1.8;
            color: #334155;
        }

        footer {
            position: absolute;
            bottom: 2%;
            width: 100%;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 移动端自适应 */
        @media (max-width: 768px) {
            .universe-title { font-size: 1.7rem; }
            .wire-text { font-size: 1.8rem; }
            .headphone-wire-svg { width: 35px; height: 20px; }
            #wire-about { top: 62%; left: 3%; }
            #wire-internship { top: 48%; left: 4%; }
            #wire-school { top: 32%; left: 5%; }
            #wire-life { top: 38%; right: 3%; }
            #wire-contact { top: 54%; right: 3%; }
        }
    </style>
</head>
<body>

    <!-- 顶栏标题 -->
    <header>
        <h1 class="universe-title">Irene Wang's Universe</h1>
        <p class="universe-sub">The Playlist of My Life & Portfolio</p>
    </header>

    <!-- 5个纯正“耳机线连笔字体”组件 -->
    
    <!-- 1. About Me -->
    <div class="wire-item" id="wire-about" onclick="openModal('about')">
        <!-- 左侧耳塞与连线 -->
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 6 12 C 3 12, 1 15, 4 19 C 7 23, 12 19, 9 15 Z" fill="#ffffff"/>
            <path d="M 7 19 C 7 26, 22 25, 60 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="wire-text">About Me</span>
        <!-- 右侧连线与耳塞/插头 -->
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 0 16 C 38 7, 53 25, 53 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 53 17 C 49 13, 53 9, 57 9 C 61 13, 57 21, 53 17 Z" fill="#ffffff"/>
        </svg>
    </div>

    <!-- 2. My Internship -->
    <div class="wire-item" id="wire-internship" onclick="openModal('internship')">
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 6 12 C 3 12, 1 15, 4 19 C 7 23, 12 19, 9 15 Z" fill="#ffffff"/>
            <path d="M 7 19 C 7 26, 22 25, 60 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="wire-text">My Internship</span>
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 0 16 C 38 7, 53 25, 53 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 53 17 C 49 13, 53 9, 57 9 C 61 13, 57 21, 53 17 Z" fill="#ffffff"/>
        </svg>
    </div>

    <!-- 3. My School -->
    <div class="wire-item" id="wire-school" onclick="openModal('school')">
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 6 12 C 3 12, 1 15, 4 19 C 7 23, 12 19, 9 15 Z" fill="#ffffff"/>
            <path d="M 7 19 C 7 26, 22 25, 60 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="wire-text">My School</span>
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 0 16 C 38 7, 53 25, 53 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 53 17 C 49 13, 53 9, 57 9 C 61 13, 57 21, 53 17 Z" fill="#ffffff"/>
        </svg>
    </div>

    <!-- 4. My Life -->
    <div class="wire-item" id="wire-life" onclick="openModal('life')">
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 6 12 C 3 12, 1 15, 4 19 C 7 23, 12 19, 9 15 Z" fill="#ffffff"/>
            <path d="M 7 19 C 7 26, 22 25, 60 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="wire-text">My Life</span>
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 0 16 C 38 7, 53 25, 53 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 53 17 C 49 13, 53 9, 57 9 C 61 13, 57 21, 53 17 Z" fill="#ffffff"/>
        </svg>
    </div>

    <!-- 5. Contact Me -->
    <div class="wire-item" id="wire-contact" onclick="openModal('contact')">
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 6 12 C 3 12, 1 15, 4 19 C 7 23, 12 19, 9 15 Z" fill="#ffffff"/>
            <path d="M 7 19 C 7 26, 22 25, 60 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="wire-text">Contact Me</span>
        <svg class="headphone-wire-svg" viewBox="0 0 60 30">
            <path d="M 0 16 C 38 7, 53 25, 53 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 53 17 C 49 13, 53 9, 57 9 C 61 13, 57 21, 53 17 Z" fill="#ffffff"/>
        </svg>
    </div>

    <!-- 页脚 -->
    <footer>
        © 2026 Irene Wang • All Rights Reserved
    </footer>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const contentMap = {
            'about': `<div class="modal-title">🎧 About Me</div><div class="modal-body"><strong>关于我 / 个人简介</strong><br><br>在此处写入你的自我介绍、求职方向与核心优势...</div>`,
            'internship': `<div class="modal-title">💼 My Internship</div><div class="modal-body"><strong>实习与工作经历</strong><br><br>在此处写入你的实习公司、负责工作及成果总结...</div>`,
            'school': `<div class="modal-title">🎓 My School</div><div class="modal-body"><strong>校园与学术背景</strong><br><br>在此处写入你的大学专业、学术课题或社团经验...</div>`,
            'life': `<div class="modal-title">📷 My Life</div><div class="modal-body"><strong>日常与生活记录</strong><br><br>在此处写入你的日常随笔、摄影集或 Vlog 分享...</div>`,
            'contact': `<div class="modal-title">✉️ Contact Me</div><div class="modal-body"><strong>联系方式</strong><br><br>📧 邮箱：your_email@example.com<br>📱 微信：your_wechat_id</div>`
        };

        function openModal(type) {
            document.getElementById('modalContent').innerHTML = contentMap[type] || '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }
    </script>
</body>
</html>
