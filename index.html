<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Wang's Universe</title>
    <!-- 引入 Special Elite (打字机字体) 与 中文字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FFFDF9;
            --card-bg: #FAF6F0;
            --red-primary: #C82323;
            --red-light: #FFECEC;
            --pink-badge: #FFD2DA;
            --text-dark: #2B2121;
            --text-red: #A81B1B;
            --border-red: #C82323;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            color: #ffffff;
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* 顶栏主标题 */
        header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        .universe-title {
            font-family: 'Special Elite', monospace;
            font-size: 2.3rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .universe-sub {
            font-family: 'Special Elite', monospace;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 2px;
            margin-top: 4px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* --------------------------------------------------
           主页：5个写实水漂鸡蛋花图标 (纯图标，悬停显字)
        -------------------------------------------------- */
        .plumeria-btn {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 24px rgba(2, 30, 40, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: flowerFloat 4.5s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1.5deg); }
        }

        .plumeria-btn:hover {
            transform: scale(1.15) translateY(-4px) !important;
            background: rgba(255, 255, 255, 0.65);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* 悬停显示气泡标题 */
        .plumeria-btn::after {
            content: attr(data-title);
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: #FFFDF9;
            color: var(--text-dark);
            font-family: 'Special Elite', 'Noto Sans SC', monospace;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 20px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 2px 2px 0 var(--border-red);
            border: 1.5px solid var(--border-red);
        }

        .plumeria-btn:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .plumeria-svg {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            filter: drop-shadow(2px 4px 5px rgba(3, 34, 45, 0.35));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .plumeria-btn:hover .plumeria-svg {
            transform: rotate(45deg) scale(1.1);
        }

        /* 5个鸡蛋花位置 (落于干净湖面上) */
        #flower-about { top: 62%; left: 12%; animation-delay: 0s; }
        #flower-internship { top: 48%; left: 22%; animation-delay: 0.9s; }
        #flower-school { top: 32%; left: 28%; animation-delay: 1.8s; }
        #flower-life { top: 38%; right: 14%; animation-delay: 0.4s; }
        #flower-contact { top: 56%; right: 10%; animation-delay: 1.3s; }

        /* --------------------------------------------------
           弹窗蒙版及复古红白贴纸卡片
        -------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        /* 复古红白爱心贴纸卡片 */
        .portfolio-card {
            position: relative;
            background: var(--card-bg);
            border: 3px solid var(--border-red);
            border-radius: 24px;
            width: 100%;
            max-width: 860px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 12px 32px rgba(200, 35, 35, 0.18), 6px 6px 0px var(--border-red);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: var(--red-light);
            border: 2px solid var(--red-primary);
            color: var(--text-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 2px 2px 0 var(--red-primary);
            transition: transform 0.2s;
            z-index: 30;
        }

        .close-btn:hover {
            transform: scale(1.15) rotate(90deg);
            background: var(--red-primary);
            color: #ffffff;
        }

        /* Header 区域 */
        .card-header {
            border-bottom: 2px dashed #E5C4C4;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 6px;
        }

        .name-en {
            font-family: 'Special Elite', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .name-cn-badge {
            background: var(--pink-badge);
            color: var(--text-red);
            border: 1.5px solid var(--red-primary);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 1px 1px 0 var(--red-primary);
        }

        .slogan {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 1.25rem;
            color: var(--text-red);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .sub-welcome {
            font-family: 'Special Elite', monospace;
            font-size: 0.85rem;
            color: #885555;
            margin-top: 4px;
        }

        /* 主体网格布局 */
        .card-body-grid {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 28px;
            align-items: start;
        }

        /* 左侧照片贴纸框 (顶部与右侧 Hii 齐平) */
        .photo-frame {
            position: relative;
            background: #FFFFFF;
            border: 2.5px solid var(--border-red);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 3px 4px 0px var(--border-red);
            width: 100%;
        }

        .photo-tape {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--red-light);
            border: 1.5px solid var(--red-primary);
            color: var(--text-red);
            font-size: 12px;
            font-weight: bold;
            padding: 2px 14px;
            border-radius: 8px;
            box-shadow: 1px 1px 0 var(--red-primary);
        }

        .photo-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        /* 右侧信息区 */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 气泡介绍框 */
        .bio-box {
            background: #FFF5F5;
            border: 2px solid var(--border-red);
            border-radius: 16px;
            padding: 14px 18px;
            position: relative;
            box-shadow: 2px 2px 0 var(--border-red);
        }

        .bio-title {
            font-weight: 700;
            color: var(--text-red);
            font-size: 15px;
            margin-bottom: 6px;
        }

        .bio-text {
            font-size: 13.5px;
            line-height: 1.65;
            color: #4A3A3A;
        }

        /* 模块分类 */
        .section-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-red);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 复古贴纸胶囊标签 */
        .tag-item {
            background: #FFFFFF;
            border: 1.5px solid var(--border-red);
            color: var(--text-dark);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 1.5px 1.5px 0 var(--border-red);
        }

        .tag-item.highlight {
            background: var(--red-light);
        }

        footer {
            position: absolute;
            bottom: 2%;
            width: 100%;
            text-align: center;
            font-family: 'Special Elite', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        @media (max-width: 680px) {
            .universe-title { font-size: 1.7rem; }
            .card-body-grid { grid-template-columns: 1fr; gap: 20px; }
            .portfolio-card { padding: 20px; }
            .photo-img { height: 240px; }
        }
    </style>
</head>
