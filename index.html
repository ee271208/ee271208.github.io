<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Wang's Universe</title>
    <!-- 引入优雅衬线体与无衬线字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans SC', sans-serif;
            color: #ffffff;
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* 顶栏标题 */
        header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        .universe-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }

        .universe-sub {
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
            margin-top: 2px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* --------------------------------------------------
           方案二：拟真写实鸡蛋花组件 (Realistic Plumeria Button)
        -------------------------------------------------- */
        .plumeria-btn {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            padding: 6px 18px 6px 10px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(2, 30, 40, 0.25);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 模仿水面轻柔浮动 */
            animation: flowerFloat 4.5s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1.5deg); }
        }

        .plumeria-btn:hover {
            transform: scale(1.1) translateY(-4px) !important;
            background: rgba(255, 255, 255, 0.42);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.4), 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* 写实鸡蛋花 SVG */
        .plumeria-svg {
            width: 38px;
            height: 38px;
            margin-right: 10px;
            flex-shrink: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .plumeria-btn:hover .plumeria-svg {
            transform: rotate(45deg) scale(1.12);
        }

        /* 模块文字 */
        .plumeria-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        /* --------------------------------------------------
           5个鸡蛋花在湖水区域的精准定位
        -------------------------------------------------- */
        /* 1. About Me (左下水面) */
        #flower-about { top: 62%; left: 11%; animation-delay: 0s; }
        
        /* 2. My Internship (左中水面) */
        #flower-internship { top: 48%; left: 21%; animation-delay: 0.9s; }
        
        /* 3. My School (左上空白水面，绝不挡锁骨与人像) */
        #flower-school { top: 32%; left: 27%; animation-delay: 1.8s; }
        
        /* 4. My Life (右上水面) */
        #flower-life { top: 38%; right: 13%; animation-delay: 0.4s; }
        
        /* 5. Contact Me (右下水面) */
        #flower-contact { top: 56%; right: 9%; animation-delay: 1.3s; }

        /* 详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.9);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .modal-body {
            font-size: 0.92rem;
            line-height: 1.8;
            color: #334155;
        }

        footer {
            position: absolute;
            bottom: 2%;
            width: 100%;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 移动端兼容 */
        @media (max-width: 768px) {
            .universe-title { font-size: 1.7rem; }
            .plumeria-btn { padding: 4px 14px 4px 8px; }
            .plumeria-svg { width: 30px; height: 30px; margin-right: 6px; }
            .plumeria-text { font-size: 0.9rem; }
            #flower-about { top: 62%; left: 3%; }
            #flower-internship { top: 48%; left: 4%; }
            #flower-school { top: 32%; left: 5%; }
            #flower-life { top: 38%; right: 3%; }
            #flower-contact { top: 54%; right: 3%; }
        }
    </style>
</head>
<body>

    <!-- 顶栏标题 -->
    <header>
        <h1 class="universe-title">Irene Wang's Universe</h1>
        <p class="universe-sub">Welcome to My Personal Space</p>
    </header>

    <!-- 可复用的写实鸡蛋花 SVG 模板（包含拟真重叠花瓣、渐变与水面暗影） -->
    <svg style="display: none;">
        <defs>
            <!-- 水面写实阴影 -->
            <filter id="plumeriaShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#03222d" flood-opacity="0.45"/>
            </filter>
            <!-- 柔和乳白花瓣渐变 -->
            <linearGradient id="petalGrad" x1="0%" y1="100%" x2="30%" y2="0%">
                <stop offset="0%" stop-color="#f2f0eb"/>
                <stop offset="60%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
            <!-- 鲜艳拟真鸡蛋花黄色花芯晕染 -->
            <radialGradient id="centerYellow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff9d00"/>
                <stop offset="35%" stop-color="#ffca00"/>
                <stop offset="70%" stop-color="#ffe97d" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
        </defs>
    </svg>

    <!-- 5个写实水漂鸡蛋花按钮 -->

    <!-- 1. About Me -->
    <div class="plumeria-btn" id="flower-about" onclick="openModal('about')">
        <svg class="plumeria-svg" viewBox="0 0 100 100">
            <g filter="url(#plumeriaShadow)">
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(72 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(144 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(216 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="23" fill="url(#centerYellow)"/>
            </g>
        </svg>
        <span class="plumeria-text">About Me</span>
    </div>

    <!-- 2. My Internship -->
    <div class="plumeria-btn" id="flower-internship" onclick="openModal('internship')">
        <svg class="plumeria-svg" viewBox="0 0 100 100">
            <g filter="url(#plumeriaShadow)">
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(72 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(144 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(216 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="23" fill="url(#centerYellow)"/>
            </g>
        </svg>
        <span class="plumeria-text">My Internship</span>
    </div>

    <!-- 3. My School -->
    <div class="plumeria-btn" id="flower-school" onclick="openModal('school')">
        <svg class="plumeria-svg" viewBox="0 0 100 100">
            <g filter="url(#plumeriaShadow)">
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(72 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(144 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(216 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="23" fill="url(#centerYellow)"/>
            </g>
        </svg>
        <span class="plumeria-text">My School</span>
    </div>

    <!-- 4. My Life -->
    <div class="plumeria-btn" id="flower-life" onclick="openModal('life')">
        <svg class="plumeria-svg" viewBox="0 0 100 100">
            <g filter="url(#plumeriaShadow)">
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(72 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(144 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(216 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="23" fill="url(#centerYellow)"/>
            </g>
        </svg>
        <span class="plumeria-text">My Life</span>
    </div>

    <!-- 5. Contact Me -->
    <div class="plumeria-btn" id="flower-contact" onclick="openModal('contact')">
        <svg class="plumeria-svg" viewBox="0 0 100 100">
            <g filter="url(#plumeriaShadow)">
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(72 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(144 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(216 50 50)"/>
                <path d="M50 50 C30 35 24 10 46 5 C64 0 68 22 50 50 Z" fill="url(#petalGrad)" stroke="#e3ded5" stroke-width="0.6" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="23" fill="url(#centerYellow)"/>
            </g>
        </svg>
        <span class="plumeria-text">Contact Me</span>
    </div>

    <!-- 页脚 -->
    <footer>
        © 2026 Irene Wang • All Rights Reserved
    </footer>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const contentMap = {
            'about': `<div class="modal-title">🌸 About Me</div><div class="modal-body"><strong>关于我 / 个人简介</strong><br><br>在此处写入你的自我介绍、核心优势与个人亮点...</div>`,
            'internship': `<div class="modal-title">💼 My Internship</div><div class="modal-body"><strong>实习与工作经历</strong><br><br>在此处写入你的实习公司、项目职责与主要成果...</div>`,
            'school': `<div class="modal-title">🎓 My School</div><div class="modal-body"><strong>校园与学术背景</strong><br><br>在此处写入你的大学专业、课程项目或学术经验...</div>`,
            'life': `<div class="modal-title">📷 My Life</div><div class="modal-body"><strong>日常与生活记录</strong><br><br>在此处写入你的摄影相册、生活随笔或 Vlog 链接...</div>`,
            'contact': `<div class="modal-title">✉️ Contact Me</div><div class="modal-body"><strong>联系方式</strong><br><br>📧 邮箱：your_email@example.com<br>📱 微信：your_wechat_id</div>`
        };

        function openModal(type) {
            document.getElementById('modalContent').innerHTML = contentMap[type] || '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }
    </script>
</body>
</html>
