<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>实习经历总览</title>
  <!-- 引入 GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0b0e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

    h1 { margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }

    /* 网格布局 */
    .grid-container {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .intern-icon {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      background: #1a1a22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      user-select: none;
      will-change: transform;
    }

    .intern-icon img { width: 40px; height: 40px; margin-bottom: 8px; pointer-events: none; }
    .intern-icon span { font-size: 13px; color: #aaa; pointer-events: none; }

    /* 弹窗样式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #16161c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 32px;
      max-width: 550px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      position: relative;
    }

    .close-btn { position: absolute; top: 16px; right: 20px; font-size: 24px; cursor: pointer; color: #888; }
    .close-btn:hover { color: #fff; }
    .modal-card h2 { margin-bottom: 16px; font-size: 20px; color: #4db8ff; }
    .modal-card div { font-size: 14px; line-height: 1.6; color: #ccc; white-space: pre-line; }
  </style>
</head>
<body>

  <h1>实习经历总览</h1>

  <div class="grid-container" id="grid">
    <!-- 天健实习图标 -->
    <div class="intern-icon" 
         data-title="天健会计师事务所 — 管理咨询实习" 
         data-detail="【项目一：某国企内控评估】&#10;• 访谈 5 大部门与 20+ 员工，梳理核心业务流程&#10;• 核查 2.8 亿合同与 3000+ 凭证，识别潜在风险&#10;&#10;【项目二：芯片龙头 IPO 研发内控】&#10;• 清洗 500+ 研发人员工时，搭建模型确保 100% 准确率&#10;• 独立完成 6 地主体薪酬复核与底稿编制">
      <span>天健</span>
    </div>

    <!-- 凌迪实习图标 -->
    <div class="intern-icon" 
         data-title="凌迪 Style3D — 实习经历" 
         data-detail="• 参与 3D 数字化服装解决方案的相关支撑工作&#10;• 协助优化内控与跨部门协同流程">
      <span>Style3D</span>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <span class="close-btn" id="close-btn">&times;</span>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const icons = document.querySelectorAll('.intern-icon');
    const radius = 220;    // 影响半径（像素）
    const maxScale = 2.2;  // 最大放大幅度

    // 1. 鼠标靠近临近放大算法（Proximity Scale Grid 核心 logic）
    document.addEventListener('mousemove', (e) => {
      icons.forEach(icon => {
        const rect = icon.getBoundingClientRect();
        const iconX = rect.left + rect.width / 2;
        const iconY = rect.top + rect.height / 2;

        // 计算鼠标与图标中心点的距离
        const dist = Math.hypot(e.clientX - iconX, e.clientY - iconY);

        if (dist < radius) {
          // 越靠近放大倍数越大
          const scale = 1 + (maxScale - 1) * ((radius - dist) / radius);
          gsap.to(icon, { scale: scale, duration: 0.25, ease: "power2.out", overwrite: "auto" });
        } else {
          gsap.to(icon, { scale: 1, duration: 0.35, ease: "power2.out", overwrite: "auto" });
        }
      });
    });

    // 2. 点击图标打开详情弹窗
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const closeBtn = document.getElementById('close-btn');

    icons.forEach(icon => {
      icon.addEventListener('click', () => {
        modalTitle.innerText = icon.dataset.title;
        modalBody.innerText = icon.dataset.detail;
        modal.classList.add('active');
      });
    });

    // 关闭弹窗
    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
