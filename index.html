<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Wang's Universe</title>
    <!-- 引入 Ins 惬意质感英文字体与无衬线体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans SC', sans-serif;
            color: #ffffff;
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* 顶栏标题 */
        header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        .universe-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }

        .universe-sub {
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
            margin-top: 2px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* --------------------------------------------------
           写实鸡蛋花纯图标按钮 (悬停显示 Ins 奶油色气泡)
        -------------------------------------------------- */
        .plumeria-btn {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 24px rgba(2, 30, 40, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: flowerFloat 4.5s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1.5deg); }
        }

        .plumeria-btn:hover {
            transform: scale(1.15) translateY(-4px) !important;
            background: rgba(255, 255, 255, 0.65);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* 悬停气泡提示 (Ins 柔和气泡) */
        .plumeria-btn::after {
            content: attr(data-title);
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #44403c;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 20px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .plumeria-btn:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* 写实鸡蛋花 SVG 图标 */
        .plumeria-svg {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            filter: drop-shadow(2px 4px 5px rgba(3, 34, 45, 0.35));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .plumeria-btn:hover .plumeria-svg {
            transform: rotate(45deg) scale(1.1);
        }

        /* 5个模块精准定位 */
        #flower-about { top: 62%; left: 12%; animation-delay: 0s; }
        #flower-internship { top: 48%; left: 22%; animation-delay: 0.9s; }
        #flower-school { top: 32%; left: 28%; animation-delay: 1.8s; }
        #flower-life { top: 38%; right: 14%; animation-delay: 0.4s; }
        #flower-contact { top: 56%; right: 10%; animation-delay: 1.3s; }

        /* --------------------------------------------------
           Ins 欧阳娜娜风 · 奶油燕麦色卡片弹窗
        -------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        /* Ins 风格奶油卡片 */
        .modal-card-ins {
            background: rgba(253, 251, 247, 0.95);
            color: #292524;
            width: 100%;
            max-width: 820px;
            max-height: 88vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 1);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.9);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* 顶部小红点关闭按钮 */
        .close-dot {
            position: absolute;
            top: 20px;
            right: 22px;
            width: 13px;
            height: 13px;
            background: #ff5f56;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 95, 86, 0.4);
            transition: transform 0.2s ease;
        }

        .close-dot:hover {
            transform: scale(1.25);
        }

        /* About Me 双栏布局 */
        .about-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 28px;
            align-items: start;
        }

        .about-avatar {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(68, 64, 60, 0.12);
            border: 3px solid #ffffff;
        }

        .about-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .about-header-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #1c1917;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .about-header-cn {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.15rem;
            font-weight: 400;
            color: #78716c;
        }

        .about-quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: #a8a29e;
            margin-top: -6px;
        }

        /* 自我介绍温馨黄底卡片 */
        .about-intro {
            font-size: 0.88rem;
            line-height: 1.75;
            color: #44403c;
            background: #f5f0e6;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 3px solid #d97706;
        }

        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #a8a29e;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Ins 奶油感胶囊标签 */
        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            background: #f5f0e6;
            border: 1px solid #e7dfd3;
            color: #44403c;
            font-size: 0.82rem;
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .pill:hover {
            background: #eae2d4;
            border-color: #d6cebe;
            transform: translateY(-1px);
        }

        .about-footer-note {
            margin-top: 10px;
            font-size: 0.84rem;
            color: #78716c;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #e7dfd3;
            padding-top: 14px;
        }

        footer {
            position: absolute;
            bottom: 2%;
            width: 100%;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 移动端自适应 */
        @media (max-width: 768px) {
            .universe-title { font-size: 1.7rem; }
            .about-grid { grid-template-columns: 1fr; gap: 20px; }
            .about-avatar { height: 260px; }
            #flower-about { top: 62%; left: 4%; }
            #flower-internship { top: 48%; left: 5%; }
            #flower-school { top: 32%; left: 6%; }
            #flower-life { top: 38%; right: 4%; }
            #flower-contact { top: 54%; right: 4%; }
        }
    </style>
</head>

        function openModal(type) {
            document.getElementById('modalContent').innerHTML = contentMap[type] || '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }
    </script>
</body>
</html>
