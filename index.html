<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Wang's Universe</title>
    <!-- 引入 Special Elite (vibe coding 风格打字机字体) & Gaegu (Naive 稚拙手绘字体) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Gaegu:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            color: #ffffff;
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* 顶栏标题 (vibe coding 特别款打字机油墨字体) */
        header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        .universe-title {
            font-family: 'Special Elite', monospace;
            font-size: 2.3rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .universe-sub {
            font-family: 'Special Elite', monospace;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
            margin-top: 4px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* --------------------------------------------------
           写实鸡蛋花纯图标按钮
        -------------------------------------------------- */
        .plumeria-btn {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 24px rgba(2, 30, 40, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: flowerFloat 4.5s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1.5deg); }
        }

        .plumeria-btn:hover {
            transform: scale(1.15) translateY(-4px) !important;
            background: rgba(255, 255, 255, 0.65);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* 悬停气泡提示 */
        .plumeria-btn::after {
            content: attr(data-title);
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: #fffdfa;
            backdrop-filter: blur(8px);
            color: #292524;
            font-family: 'Gaegu', 'Special Elite', cursive;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 20px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 3px 3px 0px #292524;
            border: 2px solid #292524;
        }

        .plumeria-btn:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .plumeria-svg {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            filter: drop-shadow(2px 4px 5px rgba(3, 34, 45, 0.35));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .plumeria-btn:hover .plumeria-svg {
            transform: rotate(45deg) scale(1.1);
        }

        /* 5个模块精准定位 */
        #flower-about { top: 62%; left: 12%; animation-delay: 0s; }
        #flower-internship { top: 48%; left: 22%; animation-delay: 0.9s; }
        #flower-school { top: 32%; left: 28%; animation-delay: 1.8s; }
        #flower-life { top: 38%; right: 14%; animation-delay: 0.4s; }
        #flower-contact { top: 56%; right: 10%; animation-delay: 1.3s; }

        /* --------------------------------------------------
           Modal 弹窗容器
        -------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(30, 27, 26, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        /* --------------------------------------------------
           Naive Aesthetic (天真稚拙风) Heart 卡片
        -------------------------------------------------- */
        .modal-card-naive {
            background: #fffdfa;
            color: #292524;
            width: 100%;
            max-width: 820px;
            max-height: 88vh;
            overflow-y: auto;
            border-radius: 28px 20px 26px 22px;
            padding: 32px;
            border: 2.5px solid #292524;
            box-shadow: 6px 6px 0px #fb7185, 12px 12px 0px #292524;
            position: relative;
            animation: popNaive 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popNaive {
            from { transform: scale(0.88) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* 顶部关闭按钮 (手绘心形/圆点) */
        .naive-close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            width: 32px;
            height: 32px;
            background: #ffe4e6;
            border: 2px solid #292524;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 2px 2px 0px #292524;
            transition: all 0.2s ease;
        }

        .naive-close-btn:hover {
            transform: scale(1.15) rotate(90deg);
            background: #f43f5e;
            color: #fff;
        }

        /* About Me 标题与天真涂鸦风格 */
        .naive-header-block {
            margin-bottom: 22px;
            border-bottom: 2px dashed #f43f5e;
            padding-bottom: 14px;
        }

        .naive-name {
            font-family: 'Special Elite', monospace;
            font-size: 2rem;
            color: #1c1917;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .naive-cn-name {
            font-family: 'Gaegu', cursive;
            font-size: 1.6rem;
            font-weight: 700;
            color: #f43f5e;
            background: #ffe4e6;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1.5px solid #292524;
            transform: rotate(-2deg);
            display: inline-block;
        }

        .naive-quote {
            font-family: 'Gaegu', cursive;
            font-size: 1.25rem;
            color: #78716c;
            margin-top: 4px;
        }

        /* 布局：左侧照片，右侧信息 */
        .naive-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 28px;
            align-items: start;
        }

        /* 拍立得手绘相框 */
        .naive-photo-frame {
            background: #ffffff;
            padding: 10px 10px 18px 10px;
            border: 2px solid #292524;
            border-radius: 16px 20px 14px 18px;
            box-shadow: 4px 4px 0px #fef08a, 6px 6px 0px #292524;
            transform: rotate(-1.5deg);
            position: relative;
        }

        /* 相框顶部遮罩胶带纸 */
        .naive-photo-frame::before {
            content: "♥ Irene ♥";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(1deg);
            background: #fef08a;
            border: 1.5px solid #292524;
            color: #292524;
            font-family: 'Gaegu', cursive;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 1px 16px;
            border-radius: 4px;
        }

        .about-avatar {
            width: 100%;
            height: 310px;
            object-fit: cover;
            border-radius: 10px;
            border: 1.5px solid #292524;
        }

        .naive-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 温馨手绘风卡片对话框 */
        .naive-intro-box {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.9rem;
            line-height: 1.75;
            color: #292524;
            background: #ffe4e6;
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid #292524;
            box-shadow: 3px 3px 0px #292524;
            position: relative;
        }

        .naive-section-title {
            font-family: 'Gaegu', cursive;
            font-size: 1.3rem;
            font-weight: 700;
            color: #f43f5e;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 稚拙风贴纸胶囊标签 */
        .naive-pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .naive-pill {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 14px;
            border: 1.5px solid #292524;
            color: #292524;
            box-shadow: 2px 2px 0px #292524;
            transition: all 0.2s ease;
        }

        /* Pastel Heart 调色盘配色 */
        .pill-pink { background: #ffe4e6; }
        .pill-yellow { background: #fef08a; }
        .pill-blue { background: #e0f2fe; }
        .pill-green { background: #dcfce7; }
        .pill-purple { background: #f3e8ff; }

        .naive-pill:hover {
            transform: translateY(-2deg) scale(1.03);
        }

        .naive-footer-note {
            font-family: 'Gaegu', cursive;
            font-size: 1.2rem;
            color: #292524;
            background: #fffbeb;
            border: 1.5px dashed #292524;
            padding: 8px 14px;
            border-radius: 12px;
            margin-top: 4px;
            text-align: center;
        }

        footer {
            position: absolute;
            bottom: 2%;
            width: 100%;
            text-align: center;
            font-family: 'Special Elite', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 移动端自适应 */
        @media (max-width: 768px) {
            .universe-title { font-size: 1.6rem; }
            .naive-grid { grid-template-columns: 1fr; gap: 20px; }
            .about-avatar { height: 260px; }
            #flower-about { top: 62%; left: 4%; }
            #flower-internship { top: 48%; left: 5%; }
            #flower-school { top: 32%; left: 6%; }
            #flower-life { top: 38%; right: 4%; }
            #flower-contact { top: 54%; right: 4%; }
        }
    </style>
</head>
