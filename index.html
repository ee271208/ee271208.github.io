<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Wang's Universe</title>
    <!-- 引入高质感英文手写连笔体与衬线体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans SC', sans-serif;
            color: #ffffff;
            background: url('bj.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* 顶栏标题：高挂置顶，避开额头 */
        header {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        .universe-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.45);
        }

        .universe-sub {
            font-family: 'Caveat', cursive;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.95);
            margin-top: -2px;
            letter-spacing: 1.5px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* --------------------------------------------------
           方案一：耳机线字体组件 (Earphone Wire Text)
        -------------------------------------------------- */
        .earphone-btn {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 轻微韵律浮动 */
            animation: wireFloat 4s ease-in-out infinite;
        }

        @keyframes wireFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .earphone-btn:hover {
            transform: scale(1.15) translateY(-3px) !important;
            background: rgba(255, 255, 255, 0.92);
            border-color: #ffffff;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.4);
        }

        /* 耳机头 SVG 节点 */
        .earphone-icon {
            width: 22px;
            height: 22px;
            margin-right: 6px;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: transform 0.3s;
        }

        .earphone-btn:hover .earphone-icon {
            transform: rotate(-12deg) scale(1.1);
        }

        /* 耳机线条字体 */
        .earphone-text {
            font-family: 'Caveat', cursive;
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            line-height: 1;
            white-space: nowrap;
            position: relative;
            transition: color 0.3s;
        }

        .earphone-btn:hover .earphone-text {
            color: #0f172a;
            text-shadow: none;
        }

        /* 尾部耳机线插头 */
        .earphone-plug {
            width: 14px;
            height: 14px;
            margin-left: 6px;
            opacity: 0.85;
            flex-shrink: 0;
        }

        /* --------------------------------------------------
           5个模块在波光湖面上的精准定位（绝不遮挡人物）
        -------------------------------------------------- */
        /* 1. About Me (左下湖面) */
        #btn-about { top: 62%; left: 12%; animation-delay: 0s; }
        
        /* 2. My Internship (左中湖面) */
        #btn-internship { top: 48%; left: 22%; animation-delay: 0.8s; }
        
        /* 3. My School (左上空白湖面，避开锁骨) */
        #btn-school { top: 32%; left: 28%; animation-delay: 1.6s; }
        
        /* 4. My Life (右上空白湖面) */
        #btn-life { top: 38%; right: 14%; animation-delay: 0.4s; }
        
        /* 5. Contact Me (右下湖面) */
        #btn-contact { top: 56%; right: 10%; animation-delay: 1.2s; }

        /* 详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.9);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .modal-body {
            font-size: 0.92rem;
            line-height: 1.8;
            color: #334155;
        }

        footer {
            position: absolute;
            bottom: 2%;
            width: 100%;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 移动端兼容 */
        @media (max-width: 768px) {
            .universe-title { font-size: 1.7rem; }
            .earphone-text { font-size: 1.4rem; }
            .earphone-btn { padding: 4px 12px; }
            #btn-about { top: 62%; left: 4%; }
            #btn-internship { top: 48%; left: 5%; }
            #btn-school { top: 32%; left: 6%; }
            #btn-life { top: 38%; right: 4%; }
            #btn-contact { top: 54%; right: 4%; }
        }
    </style>
</head>
<body>

    <!-- 顶栏标题 -->
    <header>
        <h1 class="universe-title">Irene Wang's Universe</h1>
        <p class="universe-sub">🎧 listening to my portfolio & life playlist...</p>
    </header>

    <!-- 方案一：5个动态耳机线条字体按钮 -->
    
    <!-- 1. About Me -->
    <div class="earphone-btn" id="btn-about" onclick="openModal('about')">
        <svg class="earphone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 14v-3a9 9 0 0 1 18 0v3" stroke-linecap="round"/>
            <path d="M3 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
            <path d="M16 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
        </svg>
        <span class="earphone-text">About Me</span>
        <svg class="earphone-plug" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>
    </div>

    <!-- 2. My Internship -->
    <div class="earphone-btn" id="btn-internship" onclick="openModal('internship')">
        <svg class="earphone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 14v-3a9 9 0 0 1 18 0v3" stroke-linecap="round"/>
            <path d="M3 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
            <path d="M16 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
        </svg>
        <span class="earphone-text">My Internship</span>
        <svg class="earphone-plug" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>
    </div>

    <!-- 3. My School -->
    <div class="earphone-btn" id="btn-school" onclick="openModal('school')">
        <svg class="earphone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 14v-3a9 9 0 0 1 18 0v3" stroke-linecap="round"/>
            <path d="M3 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
            <path d="M16 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
        </svg>
        <span class="earphone-text">My School</span>
        <svg class="earphone-plug" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>
    </div>

    <!-- 4. My Life -->
    <div class="earphone-btn" id="btn-life" onclick="openModal('life')">
        <svg class="earphone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 14v-3a9 9 0 0 1 18 0v3" stroke-linecap="round"/>
            <path d="M3 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
            <path d="M16 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
        </svg>
        <span class="earphone-text">My Life</span>
        <svg class="earphone-plug" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>
    </div>

    <!-- 5. Contact Me -->
    <div class="earphone-btn" id="btn-contact" onclick="openModal('contact')">
        <svg class="earphone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 14v-3a9 9 0 0 1 18 0v3" stroke-linecap="round"/>
            <path d="M3 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
            <path d="M16 14a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-4z" fill="currentColor"/>
        </svg>
        <span class="earphone-text">Contact Me</span>
        <svg class="earphone-plug" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>
    </div>

    <!-- 页脚 -->
    <footer>
        © 2026 Irene Wang • All Rights Reserved
    </footer>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const contentMap = {
            'about': `<div class="modal-title">🎧 About Me</div><div class="modal-body"><strong>关于我 / 个人简介</strong><br><br>在此处写入你的自我介绍与核心亮点...</div>`,
            'internship': `<div class="modal-title">💼 My Internship</div><div class="modal-body"><strong>实习与工作经历</strong><br><br>在此处写入你的实习经历与具体成果...</div>`,
            'school': `<div class="modal-title">🎓 My School</div><div class="modal-body"><strong>校园与学术背景</strong><br><br>在此处写入你的院校背景与学术体验...</div>`,
            'life': `<div class="modal-title">📷 My Life</div><div class="modal-body"><strong>日常与生活记录</strong><br><br>在此处写入你的日常记录、爱好与Vlog...</div>`,
            'contact': `<div class="modal-title">✉️ Contact Me</div><div class="modal-body"><strong>联系方式</strong><br><br>📧 邮箱：your_email@example.com<br>📱 微信：your_wechat_id</div>`
        };

        function openModal(type) {
            document.getElementById('modalContent').innerHTML = contentMap[type] || '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'modalOverlay') closeModal();
        }
    </script>
</body>
</html>
